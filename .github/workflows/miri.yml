name: Miri test

on: [ push, pull_request ]

jobs:
  build:
    name: Test with Miri
    runs-on: ${{ matrix.os }}
    # We want to run on external PRs, but not on internal ones as push automatically builds
    # H/T: https://github.com/Dart-Code/Dart-Code/commit/612732d5879730608baa9622bf7f5e5b7b51ae65
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust'
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        # build and test for experimental features with miri
        features: [ 'experimental' ]
    permissions:
      checks: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: miri
          rustflags: "" # Default: "-D warnings', we do not want that for now.
          override: true
      - name: Setup Miri
        run: cargo miri setup
      - name: Test with Miri (ubuntu and macos)
        # miri test for Linux and macOS os, since Windows os requires a different syntax to enable miri flags
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        # Miri flags
        #
        # -Zmiri-disable-isolation
        #     We need to pass the miri flag to disable host isolation in order to access host for clock information on timestamps
        #     more information can be found: https://github.com/rust-lang/miri#miri--z-flags-and-environment-variables
        #
        # -Zmiri-tree-borrows
        #     Miri's default aliasing model (stacked borrows) is known to be unnecessarily restrictive. Their alternative
        #     aliasing model (tree borrows) accepts valid programs that stacked borrows would reject.
        #     For more information, see: https://www.ralfj.de/blog/2023/06/02/tree-borrows.html
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-tree-borrows" cargo miri test serde --features "${{ matrix.features }}"
      - name: Test with Miri (windows)
        if: matrix.os == 'windows-latest'
        run: $env:MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-tree-borrows" ; cargo miri test serde --features "${{ matrix.features }}"

  unsafe-representations:
    name: Miri over the OverflowingInt representation
    # A single runner: Miri interprets the abstract machine, so these tests —
    # which have no syscalls, FFI, clock, or `cfg`-conditional code — behave
    # identically across host OSes. The dimensions the layout actually depends on
    # are pointer width and endianness, both exercised below by cross-target Miri
    # runs (i686 for 32-bit, s390x for big-endian) rather than by a second host OS
    # (all GitHub runners are 64-bit little-endian). The wasm32 `cargo check` in
    # `rust.yml` is a separate, compile-time confirmation that the layout
    # assertions hold at a 32-bit pointer width; it does not exercise the unsafe
    # reads, and (see that job's comment) does not itself shrink `HeapValue`.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust'
    permissions:
      checks: write
    env:
      # Module-path test selection, defined once. Each dependent part appends its own module; the
      # folded scalar joins the lines with spaces and the value word-splits into one filter each.
      # (No `#` comments inside the block -- they would become literal filter words. Document each
      # module here instead.)
      #   overflowing_int              -- 16-byte overflowing integer representation
      #   move_soundness_tests         -- raw binary writer stays sound when moved (AliasableBump arena)
      # (The reusable-writer `reuse_tests` verify behavior, not unsafe soundness, so they run under
      # normal `cargo test` only -- their large allocations are prohibitively slow under Miri.)
      MIRI_TEST_SELECTION: >-
        overflowing_int
        move_soundness_tests
        annotations
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: miri
          rustflags: "" # Default: "-D warnings', we do not want that for now.
          override: true
      - name: Setup Miri
        run: cargo miri setup
      # The `serde` job above filters by test name and will not select these
      # tests. This job selects by MODULE PATH via `MIRI_TEST_SELECTION` (above),
      # which fails closed for a new test in a selected module (it runs with no
      # per-name registration). A module *rename*, however, would make the
      # selection match nothing and libtest would exit 0, so `run-miri.sh` wraps
      # each invocation and fails when zero tests execute. Filters go after `--`
      # (Cargo rejects multiple bare filters).
      #
      # `-Zmiri-strict-provenance` is in the flag set from the start: the union
      # reads its tag through a dedicated arm so it never materializes the boxed
      # pointer as an integer, and this flag is what enforces that.
      - name: Test with Miri (native x86-64, 64-bit, little-endian)
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-strict-provenance" ./run-miri.sh -- $MIRI_TEST_SELECTION
      # 32-bit pointer width: `Box` is 4 bytes, so `HeapValue`'s layout and
      # trailing padding differ from the 64-bit case, and `u64` aligns to 4 under
      # this ABI. Exercises the unsafe reads against a layout the 64-bit run
      # cannot produce. (The wasm32 `cargo check` covers the 32-bit assertions at
      # compile time; this runs the unsafe under a 32-bit interpreter.)
      - name: Test with Miri (i686, 32-bit, little-endian)
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-strict-provenance" ./run-miri.sh --target i686-unknown-linux-gnu -- $MIRI_TEST_SELECTION
      # Big-endian target: the union reconstructs its magnitude from `u64` word
      # values rather than raw bytes, so the layout must be endian-independent.
      # Miri interprets the foreign target directly (no s390x toolchain needed),
      # which is a stronger check than any little-endian second OS.
      - name: Test with Miri (s390x, 64-bit, big-endian)
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-strict-provenance" ./run-miri.sh --target s390x-unknown-linux-gnu -- $MIRI_TEST_SELECTION

  confirm-miri:
    # A single "join" over both Miri jobs so branch protection can require one
    # stable check name and neither the serde matrix nor the unsafe-representation
    # coverage can regress without blocking merge.
    needs: [build, unsafe-representations]
    name: Miri Confirmation
    runs-on: ubuntu-latest
    # We must include always() even with additional conditions in order to override the default status check of
    # success() that is automatically applied to if conditions that don't contain a status check function.
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust') }}
    steps:
      - run: echo "build=${{ needs.build.result }} unsafe-representations=${{ needs.unsafe-representations.result }}"
      - if: needs.build.result != 'success' || needs.unsafe-representations.result != 'success'
        run: exit 1

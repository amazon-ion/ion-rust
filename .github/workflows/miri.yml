name: Miri test

on: [ push, pull_request ]

env:
  # Miri, its `-Z` flags, and its diagnostics change between nightlies, so the toolchain is pinned
  # and bumped deliberately. Use the same toolchain to reproduce a CI run locally.
  MIRI_TOOLCHAIN: nightly-2026-08-21

jobs:
  full-library:
    name: Miri over the library (${{ matrix.aliasing }} borrows)
    # A single runner: Miri interprets the abstract machine and the crate has no
    # OS-specific code paths, so additional host OSes add cost without coverage.
    runs-on: ubuntu-latest
    # Bounds the job so that a pathologically slow new test fails it instead of running for hours.
    # Tests that are too slow under Miri are marked `#[cfg_attr(miri, ignore = "...")]`.
    timeout-minutes: 60
    # We want to run on external PRs, but not on internal ones as push automatically builds
    # H/T: https://github.com/Dart-Code/Dart-Code/commit/612732d5879730608baa9622bf7f5e5b7b51ae65
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust'
    strategy:
      fail-fast: false
      matrix:
        # Tree borrows accepts some valid programs that stacked borrows (Miri's default aliasing
        # model) rejects. The library is checked against both.
        # For more information, see: https://www.ralfj.de/blog/2023/06/02/tree-borrows.html
        include:
          - aliasing: tree
            aliasing-flag: -Zmiri-tree-borrows
          - aliasing: stacked
            aliasing-flag: ""
    permissions:
      checks: write

    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri
          rustflags: "" # Default: "-D warnings', we do not want that for now.
          override: true
      - name: Setup Miri
        run: cargo miri setup
      - name: Test with Miri
        # Runs every library unit test, with all features enabled.
        #
        # Miri flags
        #
        # -Zmiri-disable-isolation
        #     We need to pass the miri flag to disable host isolation in order to access host for clock information on timestamps
        #     more information can be found: https://github.com/rust-lang/miri#miri--z-flags-and-environment-variables
        #
        # -Zmiri-strict-provenance
        #     Rejects integer-to-pointer casts, so pointers keep their provenance.
        #
        # -Zmiri-deterministic-floats
        #     Miri otherwise perturbs the results of float operations whose precision Rust does not
        #     specify (e.g. `powi`), which breaks tests that compare against exact values.
        run: MIRIFLAGS="-Zmiri-disable-isolation ${{ matrix.aliasing-flag }} -Zmiri-strict-provenance -Zmiri-deterministic-floats" cargo miri test --lib --all-features

  representations:
    name: Miri over ${{ matrix.module }} (32-bit and big-endian)
    # These modules use `unsafe` whose layout depends on pointer width and endianness. A single
    # runner suffices: those dimensions are exercised by cross-target Miri runs (i686 for 32-bit,
    # s390x for big-endian) rather than by a second host OS (all GitHub runners are 64-bit
    # little-endian). The `full-library` job covers the native target. The wasm32 `cargo check` in
    # `rust.yml` is a separate, compile-time confirmation that the layout assertions hold at a
    # 32-bit pointer width; it does not exercise the unsafe reads, and (see that job's comment) does
    # not itself shrink `HeapValue`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust'
    strategy:
      fail-fast: false
      matrix:
        # One module path per job, so `run-miri.sh`'s zero-test check catches a rename of any of
        # them.
        #   types::overflowing_int:: -- 16-byte overflowing integer representation (a union)
        #   element::annotations::   -- one-word annotations representation (a tagged pointer)
        module:
          - "types::overflowing_int::"
          - "element::annotations::"
    permissions:
      checks: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri
          rustflags: "" # Default: "-D warnings', we do not want that for now.
          override: true
      - name: Setup Miri
        run: cargo miri setup
      # Miri's default aliasing model is enough here: these runs check layout and pointer
      # arithmetic on other targets, and the `full-library` job checks aliasing under both models.
      #
      # `-Zmiri-strict-provenance` is required: the `OverflowingInt` union and the annotations
      # tagged pointer never materialize their pointers as integers, and this flag is what enforces
      # that.
      #
      # 32-bit pointer width: `Box` is 4 bytes, so `HeapValue`'s layout and
      # trailing padding differ from the 64-bit case, and `u64` aligns to 4 under
      # this ABI. Exercises the unsafe reads against a layout the 64-bit run
      # cannot produce. (The wasm32 `cargo check` covers the 32-bit assertions at
      # compile time; this runs the unsafe under a 32-bit interpreter.)
      - name: Test with Miri (i686, 32-bit, little-endian)
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance -Zmiri-deterministic-floats" ./run-miri.sh --lib --target i686-unknown-linux-gnu -- "${{ matrix.module }}"
      # Big-endian target: the union reconstructs its magnitude from `u64` word
      # values rather than raw bytes, so the layout must be endian-independent.
      # Miri interprets the foreign target directly (no s390x toolchain needed),
      # which is a stronger check than any little-endian second OS.
      - name: Test with Miri (s390x, 64-bit, big-endian)
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-strict-provenance -Zmiri-deterministic-floats" ./run-miri.sh --lib --target s390x-unknown-linux-gnu -- "${{ matrix.module }}"

  confirm-miri:
    # A single "join" over all Miri jobs so branch protection can require one
    # stable check name and neither the full-library runs nor the representation
    # coverage can regress without blocking merge.
    needs: [full-library, representations]
    name: Miri Confirmation
    runs-on: ubuntu-latest
    # We must include always() even with additional conditions in order to override the default status check of
    # success() that is automatically applied to if conditions that don't contain a status check function.
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'amazon-ion/ion-rust') }}
    steps:
      - run: echo "full-library=${{ needs.full-library.result }} representations=${{ needs.representations.result }}"
      - if: needs.full-library.result != 'success' || needs.representations.result != 'success'
        run: exit 1
